[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-track-agent"
version = "0.1.0"
description = "Autonomous multi-tier cognitive agent for the ARC Prize 2026 Paper Track"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
# The agent's core modules live inside ``src/``.  ``sandbox`` and ``verifier``
# are flat modules while ``circuits`` is a package; ``package-dir`` points
# setuptools at ``src/`` so both module kinds are discovered from the right
# place during installation.
package-dir = {"" = "src"}
py-modules = ["sandbox", "verifier", "visualizer", "mdl_pruner", "tta_transforms"]
packages = ["circuits"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make ``src/`` importable as top-level modules (``sandbox``, ``verifier``)
# without requiring an editable install.
pythonpath = ["src"]
